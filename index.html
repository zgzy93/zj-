r i in ls: if i==44: print(\"found it! i=\",i) ______ else: continue","b":["break"],"a":"break"},{"id":"py-c2-151","t":"tiankong","q":"以下程序的运行结果是什么？ def func(a,b): c=a**2+b b=a return c a=10 b=100 c=func(a,b)+a print(a,b,c)______","b":["10 100 210"],"a":"10 100 210"},{"id":"py-c2-152","t":"tiankong","q":"下面的程序运行时，要求通过键盘输入某班每个同学就业的行业名称，行业名称之间用空格间隔（回车结束输入）。程序的功能是统计各行业就业的学生数量，按数量从高到低排序输出。例如： 输入内容如下：交通 计算机 通信 计算机 网络 网络 交通 计算机输出内容如下：计算机：3网络：2交通：2通信：1 完善程序，请在填空处补充合适的内容。（算术运算符和赋值运算符前后不要有空格）（排序用到的lambda的参数为x,不要使用其他名) names=input(\"请输入就业行业名称，用空格间隔（回车结束输入）：\") t=names.split() d = {} for c in range(len(t)): d[t[c]]= ______ ls = list(d.items()) ls.sort(______ ) # 按照数量排序 for k in range(len(ls)): zy,num=ls[k] print(\"{}:{}\".format(zy,num))","b":["d.get(t[c],0)+1","key=lambda x:x[1],reverse=True"],"a":"d.get(t[c],0)+1；key=lambda x:x[1],reverse=True"},{"id":"py-c2-153","t":"tiankong","q":"给出一文本文件vote.txt，内容是校园歌手投票数据，如下所示。一行只有一个校园歌手姓名的投票才是有效票；一行有多个校园歌手姓名时，姓名之间用空格分隔，均为无效选票。下面的程序用于统计有效票数，请在[填空1][填空2]处补充合适的内容。 文本文件vote.txt内容如下。 杨雨 朱丽 陆寒 陆寒 陆寒 孙妮 杨雨 孙妮 朱丽 孙妮 杨雨…… 程序代码如下。 f = open(\"vote.txt\") names = f.readlines() f.close() n = 0 for name in ______ : num =______ if num==1: n+=1 print(\"有效票{}张\".format(n))","b":["names","len(name.split())"],"a":"names；len(name.split())"},{"id":"py-c2-154","t":"tiankong","q":"下面程序的功能是：输入以逗号分隔的一组单词，判断是否有重复的单词。如果存在重复的单词，打印“有重复单词”，退出；如果无重复的单词，把单词加到words列表中，打印“没有重复单词”。[代码]处应补充的语句是什么？ txt=input(\"请输入一组单词，以逗号分隔：\") ls=txt.split(',') words=[] for word in ls: if word in words: print(\"有重复单词\") break else: ______ else: print(\"没有重复单词\")","b":["words.append(word)"],"a":"words.append(word)"},{"id":"py-c2-155","t":"tiankong","q":"写出判断整数x能否同时被3和5整除的Python 语言表达式。（算术运算符、比较运算符和赋值运算符前后不要有空格）______","b":["x%3==0 and x%5==0"],"a":"x%3==0 and x%5==0"},{"id":"py-c2-156","t":"tiankong","q":"下面程序的输出结果是什么？ x=\"god\" y=\"\" for i in x: y+=str(ord(i)-ord('a')) print(y)______","b":["6143"],"a":"6143"},{"id":"py-c2-157","t":"tiankong","q":"假设有一个列表a，现要求从列表a中每3个元素取1个，并且将取到的元素组成新的列表b。请设计命令。（算术运算符和赋值运算符前后不要有空格）______","b":["b=a[::3]"],"a":"b=a[::3]"},{"id":"py-c2-158","t":"tiankong","q":"下面程序的功能是连接数据库并输出连接对象，在【代码1】【代码2】处补充合适的内容。 # 连接数据库的通用函数 def getConn(): dbstr=\"d:/sqlite/test.db\" conn=【代码1】 cur=conn.cursor() sqlstr=\"create table if not exists order1(order_id integer primary key,price float)\" cur=【代码2】 return conn # 调用函数getConn() print(getConn)","b":["sqlite3.connect(dbstr)","cur.execute(sqlstr)"],"a":"sqlite3.connect(dbstr)；cur.execute(sqlstr)"},{"id":"py-c2-159","t":"jianda","q":"简述程序的编译方式和解释方式的区别。","a":"编译：把源程序一次性整体翻译成目标代码，再链接成可执行文件运行，执行快、但换平台要重新编译（C/C++）。解释：逐条翻译、翻译一句执行一句，不生成独立的目标程序，跨平台方便、但执行慢（Python）。"},{"id":"py-c2-160","t":"jianda","q":"面向对象语言有哪三个特性？类的成员有那些?","a":"三大特性：封装、继承、多态。类的成员分两类：数据成员（属性/成员变量）和成员方法（函数），还包括构造方法 __init__、类方法、静态方法，以及以双下划线开头的私有成员。"},{"id":"py-c2-161","t":"jianda","q":"字符串合并与拆分的函数是什么，通过示例来验证","a":"合并用 join()，拆分用 split()。例：\",\".join(['a','b','c']) 得 'a,b,c'；'a,b,c'.split(',') 得 ['a','b','c']；split() 不带参数时按任意空白拆分。"},{"id":"py-c2-162","t":"jianda","q":"程序流程图包括哪些元素，并在word上绘出 对应的 基本元素图，截图上传","a":"流程图基本元素：起止框（圆角矩形/椭圆）、处理框（矩形）、判断框（菱形）、输入输出框（平行四边形）、流程线（箭头）、连接点（小圆圈）。"},{"id":"py-c2-163","t":"jianda","q":"requests库的get()方法返回Response对象，该对象的status_code、text、encoding等属性的含义是什么？","a":"status_code 是 HTTP 响应状态码（200 成功、404 未找到、500 服务器错误）；text 是响应内容的字符串形式（按推测编码解码后的文本）；encoding 是响应内容的编码方式（如 utf-8）。"},{"id":"py-c2-164","t":"jianda","q":"列表、元组、字典都用什么标记或函数创建？","a":"列表用 [] 或 list() 创建；元组用 () 或 tuple() 创建；字典用 {} 或 dict() 创建。"},{"id":"py-c2-165","t":"jianda","q":"Python的内置属性__name__有什么作用？","a":"__name__ 是模块的内置属性，值是模块名。直接运行该模块时其值为 '__main__'，被导入时值为模块名，所以常用 if __name__ == '__main__': 让测试代码只在直接运行时执行。"},{"id":"py-c2-166","t":"jianda","q":"简述程序设计的IPO模式的特点。","a":"IPO 指 Input（输入）→ Process（处理）→ Output（输出）。特点是按“接收数据—加工数据—输出结果”三段组织程序，职责清晰、便于分模块设计和测试。"},{"id":"py-c2-167","t":"jianda","q":"数据库可以分为关系型数据库和非关系型数据库，什么是关系？","a":"关系就是一张二维表：每一行（元组）是一条记录，每一列（属性）是一个字段，表与表之间通过公共属性（主键/外键）建立联系。"},{"id":"py-c2-168","t":"jianda","q":"数据库可以分为关系型数据库和非关系型数据库，什么是关系?","a":"与第 167 题同：关系即规范化的二维表，由关系名、属性（列）、元组（行）、域、主键等要素构成。"},{"id":"py-c2-169","t":"jianda","q":"在Python中，在不安装SQLite数据库的情况下，可以直接访问SQLite数据库吗?","a":"可以。Python 标准库自带 sqlite3 模块，不需要另外安装 SQLite 软件就能创建和访问 SQLite 数据库文件。"},{"id":"py-c2-170","t":"jianda","q":"在SQLite3的命令窗口中，操作SQLite数据库的常用命令有哪些?","a":"常用：.help 帮助、.open 文件名 打开/新建库、.tables 列所有表、.schema 表名 看表结构、.dump 导出 SQL、.mode csv/column 切显示模式、.headers on 显示列名、.read 脚本.sql 执行脚本、.quit/.exit 退出。"},{"id":"py-c2-171","t":"jianda","q":"在Python中，访问SQLite数据库主要使用哪些对象，其功能是什么?","a":"① Connection 连接对象：由 sqlite3.connect() 创建，负责连接库，提供 cursor()、commit()、rollback()、close()；② Cursor 游标对象：由 conn.cursor() 创建，负责执行 SQL 并取结果，提供 execute()、executemany()、executescript()、fetchone()、fetchall()。"},{"id":"py-c2-172","t":"jianda","q":"请列举出SQLite数据库中支持的5种数据类型?SQLite数据库的动态数据类型有什么特点?","a":"5 种类型：NULL、INTEGER、REAL、TEXT、BLOB。动态类型特点：采用“类型亲和性”，列的类型由存入的值决定而不是由声明决定，同一列可以存不同类型，列类型只是建议，可以不声明。"}]}]}]};
﻿const SUBJECTS = BANK.subjects;
const TYPE_NAME = {danxuan:"单选", panduan:"判断", tiankong:"填空", jisuan:"计算", jianda:"简答", zonghe:"综合"};
const TYPE_ORDER = ["danxuan", "panduan", "tiankong", "jisuan", "jianda", "zonghe"];
const OPEN_TYPES = ["jianda", "jisuan", "zonghe"];
const STORE_KEY = "qt_v1";
const LAST_KEY = "qt_v1_last";

SUBJECTS.forEach(s => {
  s.all = [];
  s.chapters.forEach(c => c.qs.forEach(q => { q.ch = c.id; q.chName = c.name; s.all.push(q); }));
  s.types = TYPE_ORDER.filter(t => s.all.some(q => q.t === t));
});

let S = {
  sid: null, mode: "subject", ch: null, idx: 0,
  answered: false, sel: null, inputs: null, shown: false,
  filter: new Set(), wrong: new Set(), starred: new Set(), history: {}, cache: null
};

function subject() { return SUBJECTS.find(s => s.id === S.sid) || null; }
function allQ() { const s = subject(); return s ? s.all : []; }
function totalQ() { return allQ().length; }

/* ---------- storage ---------- */
function storeKey(sid) { return STORE_KEY + "_" + (sid || S.sid); }
function loadSubject(sid) {
  S.sid = sid;
  S.wrong = new Set(); S.starred = new Set(); S.history = {};
  try {
    const raw = localStorage.getItem(storeKey(sid));
    if (raw) {
      const d = JSON.parse(raw);
      if (d.w) S.wrong = new Set(d.w);
      if (d.s) S.starred = new Set(d.s);
      if (d.h) S.history = d.h;
    }
  } catch (e) {}
  const s = subject();
  S.filter = new Set(s ? s.types : TYPE_ORDER);
  S.ch = null; S.idx = 0; S.answered = false; S.sel = null; S.inputs = null; S.shown = false; S.cache = null;
  try { localStorage.setItem(LAST_KEY, sid); } catch (e) {}
}
function readStore(sid) {
  try {
    var raw = localStorage.getItem(storeKey(sid));
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function save() {
  if (!S.sid) return;
  try {
    localStorage.setItem(storeKey(), JSON.stringify({
      w: [...S.wrong], s: [...S.starred], h: S.history
    }));
  } catch (e) {}
}

/* ---------- pool ---------- */
function pool() {
  const s = subject();
  if (!s) return [];
  let base;
  if (S.mode === "chapter") base = (s.chapters.find(c => c.id === S.ch) || { qs: [] }).qs;
  else if (S.mode === "wrong") base = s.all.filter(q => S.wrong.has(q.id));
  else if (S.mode === "starred") base = s.all.filter(q => S.starred.has(q.id));
  else if (S.mode === "random") {
    if (!S.cache || !S.cache.length) S.cache = shuffle(s.all.slice());
    base = S.cache;
  } else base = s.all;
  return base.filter(q => S.filter.has(q.t));
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function cur() { const p = pool(); return p[Math.min(S.idx, p.length - 1)]; }

/* ---------- seven segment ---------- */
const SEG = {0:"abcdef",1:"bc",2:"abged",3:"abgcd",4:"fgbc",5:"afgcd",6:"afgecd",7:"abc",8:"abcdefg",9:"abcdfg"};
const RECTS = {a:[5,2,14,3], b:[18,5,3,14], c:[18,24,3,14], d:[5,39,14,3], e:[2,24,3,14], f:[2,5,3,14], g:[5,20,14,3]};
function segDigit(d) {
  const on = SEG[d] || "";
  let s = "";
  for (const k in RECTS) {
    const r = RECTS[k];
    s += '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] + '" rx="1" fill="'
       + (on.indexOf(k) >= 0 ? "var(--sig)" : "#16231F") + '"/>';
  }
  return '<svg width="23" height="44" viewBox="0 0 23 44" aria-hidden="true">' + s + '</svg>';
}
function segReadout(n, digits) { return String(n).padStart(digits, "0").split("").map(segDigit).join(""); }

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function norm(s) { return String(s || "").replace(/[\s,，、;；:：]/g, "").toLowerCase(); }
function starIcon() { return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4l2.6 5.3 5.9.9-4.3 4.2 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 10.2l5.9-.9z"/></svg>'; }
function iconBack() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6"/></svg>'; }
function iconNext() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg>'; }

const view = document.getElementById("view");

/* ---------- render ---------- */
function render() {
  const s = subject();
  document.querySelectorAll(".tab").forEach(t => {
    t.setAttribute("aria-current", String(t.dataset.mode === S.mode));
  });
  var doneN = Object.keys(S.history).length, totalN = totalQ(), wrongN = S.wrong.size;
  if (S.mode === "subject") {
    doneN = 0; totalN = 0; wrongN = 0;
    SUBJECTS.forEach(function (s) {
      totalN += s.all.length;
      var d = readStore(s.id);
      doneN += Object.keys(d.h || {}).length;
      wrongN += (d.w || []).length;
    });
  }
  document.getElementById("statProg").textContent = doneN + "/" + totalN;
  document.getElementById("statWrong").textContent = wrongN;
  document.getElementById("brandSub").textContent = S.mode === "subject" ? (SUBJECTS.length + " 门课") : (s ? s.tag : "");

  if (S.mode === "subject") return renderSubjects();
  if (S.mode === "browse") return renderBrowse();
  if (S.mode === "chapter" && !S.ch) return renderChapters();
  renderPractice();
}

function renderSubjects() {
  var chaps = 0; SUBJECTS.forEach(function (x) { chaps += x.chapters.length; });
  const h0 = '<section class="lede"><div><h1>刷题台</h1>'
    + '<p>' + SUBJECTS.length + ' 门课 · ' + chaps + ' 份题库 · ' + SUBJECTS.reduce(function (a, b) { return a + b.all.length; }, 0) + ' 道题，答案取自学习通批改结果</p></div></section>';
  let h = h0 + '<div class="subj-list">';
  SUBJECTS.forEach((s, i) => {
    const n = s.all.length;
    const done = Object.keys(s.history || {}).length;
    let wrong = 0;
    try {
      const raw = localStorage.getItem(storeKey(s.id));
      if (raw) wrong = (JSON.parse(raw).w || []).length;
    } catch (e) {}
    const pct = n ? Math.round(done / n * 100) : 0;
    h += '<button class="subj" data-subject="' + s.id + '">'
      + '<span class="subj-no">0' + (i + 1) + '</span>'
      + '<span><span class="subj-name">' + esc(s.name) + '</span>'
      + '<span class="subj-tag">' + esc(s.tag) + '</span>'
      + '<span class="subj-meta"><span><em>' + n + '</em> 题</span><span>已答 ' + done + '</span>'
      + (wrong ? '<span class="warn">错 ' + wrong + '</span>' : '')
      + '<span><em>' + pct + '%</em></span></span>'
      + '<span class="subj-bar"><span style="width:' + pct + '%"></span></span></span>'
      + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--faint)"><path d="M9 6l6 6-6 6"/></svg>'
      + '</button>';
  });
  h += '</div>';
  view.innerHTML = h;
}

function renderChapters() {
  const s = subject();
  const answered = Object.keys(S.history).length;
  let h = '<section class="lede"><div><h1>' + esc(s.name) + '</h1>'
    + '<p>' + s.chapters.length + ' 章 · ' + s.all.length + ' 道题　'
    + '<button class="crumb" data-act="subjects">切换科目</button></p></div>'
    + '<div class="mini">已答 ' + answered + '<br>错题 ' + S.wrong.size + '</div></section>'
    + '<div class="ch-list">';
  s.chapters.forEach((ch, i) => {
    const n = ch.qs.length;
    const done = ch.qs.filter(q => S.history[q.id]).length;
    const bad = ch.qs.filter(q => S.wrong.has(q.id)).length;
    const pct = n ? Math.round(done / n * 100) : 0;
    h += '<button class="ch-row" data-ch="' + ch.id + '">'
      + '<span class="ch-no">' + (i + 1) + '</span>'
      + '<span><span class="ch-name">' + esc(ch.name) + '</span>'
      + '<span class="ch-sub"><span><em>' + n + '</em> 题</span><span>已答 ' + done + '</span>'
      + (bad ? '<span class="warn">错 ' + bad + '</span>' : '')
      + '<span>' + pct + '%</span></span>'
      + '<span class="ch-track"><span style="width:' + pct + '%"></span></span></span>'
      + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--faint)"><path d="M9 6l6 6-6 6"/></svg>'
      + '</button>';
  });
  h += '</div>';
  view.innerHTML = h;
}

function renderPractice() {
  const p = pool();
  if (!p.length) {
    const msg = S.mode === "wrong" ? ["错题本是空的", "答错的题会自动收进来。"]
      : S.mode === "starred" ? ["还没有收藏", "点题目右上角那颗星收藏。"]
      : ["这个筛选下没有题", "把题型筛选放宽一些。"];
    view.innerHTML = '<div class="empty"><h2>' + msg[0] + '</h2><p>' + msg[1] + '</p></div>';
    return;
  }
  const q = p[Math.min(S.idx, p.length - 1)];
  const pct = Math.round((S.idx + 1) / p.length * 100);
  const badge = S.mode === "chapter" ? q.chName
    : S.mode === "wrong" ? "错题本" : S.mode === "starred" ? "收藏"
    : S.mode === "random" ? "随机" : "全部题目";

  let h = '<div class="rail">'
    + '<div class="seg-display">' + segReadout(S.idx + 1, String(p.length).length) + '</div>'
    + '<span class="of">/ ' + p.length + '</span>'
    + '<div class="track"><div class="bar"><span style="width:' + pct + '%"></span></div>'
    + '<span class="pct">' + pct + '%</span></div>'
    + '</div>';

  h += '<div class="filters"><span class="f-label">题型</span>';
  subject().types.forEach(t => {
    h += '<button class="chip" data-type="' + t + '" aria-pressed="' + S.filter.has(t) + '">' + TYPE_NAME[t] + '</button>';
  });
  h += '</div>';

  h += '<article class="qcard"><div class="qhead">'
    + '<span class="qtype">' + TYPE_NAME[q.t] + '</span>'
    + '<span class="qch">' + esc(badge) + '</span>'
    + '<button class="qstar" data-act="star" aria-pressed="' + S.starred.has(q.id) + '" title="收藏">' + starIcon() + '</button>'
    + '</div>'
    + '<div class="qtext">' + esc(q.q) + '</div>';

  if (q.t === "danxuan" || q.t === "panduan") h += renderChoice(q);
  if (q.t === "tiankong") h += renderFill(q);
  if (OPEN_TYPES.indexOf(q.t) >= 0) h += renderOpen(q);

  h += '</article>';

  h += '<div class="navrow">'
    + '<button class="btn" data-act="prev" ' + (S.idx === 0 ? "disabled" : "") + '>' + iconBack() + '上一题</button>'
    + '<span class="jump">第 <input id="jump" type="number" min="1" max="' + p.length + '" value="' + (S.idx + 1) + '"> / ' + p.length + ' 题</span>'
    + '<button class="btn" data-act="next" ' + (S.idx >= p.length - 1 ? "disabled" : "") + '>下一题' + iconNext() + '</button>'
    + '</div>';

  h += '<div class="kb"><kbd>←</kbd><kbd>→</kbd> 翻题　<kbd>1</kbd>–<kbd>4</kbd> 选项　<kbd>Enter</kbd> 确认　'
    + '<kbd>S</kbd> 收藏　<kbd>R</kbd> 随机　<kbd>Space</kbd> 看答案</div>';

  view.innerHTML = h;
  const inp = document.querySelector(".fill-row input");
  if (inp && !S.answered) setTimeout(() => inp.focus(), 60);
  window.scrollTo({ top: 0, behavior: "instant" });
}

function renderChoice(q) {
  let h = '<div class="opts">';
  q.o.forEach(o => {
    let state = "";
    if (S.answered) {
      if (S.sel === o.k) state = (o.k === q.a) ? "right" : "wrong";
      else if (o.k === q.a) state = "right";
      else state = "dim";
    }
    h += '<button class="opt" data-opt="' + o.k + '" ' + (S.answered ? "disabled" : "")
      + (S.sel === o.k ? ' data-sel="1"' : '') + (state ? ' data-state="' + state + '"' : '') + '>'
      + '<span class="key">' + o.k + '</span>'
      + '<span class="val">' + esc(o.v) + '</span></button>';
  });
  h += '</div>';
  if (S.answered) {
    const ok = S.sel === q.a;
    h += '<div class="verdict' + (ok ? "" : " bad") + '">' + (ok ? "答对了" : "答错了") + '　正确答案 <b>' + esc(q.a) + '</b>'
      + (ok ? "" : '　你选 <b>' + esc(S.sel) + '</b>') + '</div>'
      + (q.note ? '<div class="note">' + esc(q.note) + '</div>' : '');
  }
  return h;
}

function renderFill(q) {
  const blanks = q.b || [q.a];
  const labels = ["第一空", "第二空", "第三空", "第四空", "第五空", "第六空"];
  let h = '<div class="fills">';
  blanks.forEach((b, i) => {
    h += '<div class="fill-row"><label>' + (blanks.length > 1 ? (labels[i] || ("第" + (i + 1) + "空")) : "答案") + '</label>'
      + '<input data-blank="' + i + '" placeholder="输入答案" autocomplete="off" '
      + (S.answered ? "disabled" : "") + ' value="' + esc((S.inputs && S.inputs[i]) || "") + '">'
      + (S.answered ? '<span class="mark">' + (norm((S.inputs && S.inputs[i]) || "") === norm(b) ? "对" : "错") + '</span>' : '')
      + '</div>';
  });
  h += '</div>';
  if (!S.answered) {
    h += '<div class="actions"><button class="btn go" data-act="check">确认</button>'
      + '<button class="btn ghost" data-act="reveal">看答案</button></div>';
  } else {
    h += '<div class="answer"><h3>参考答案</h3><div class="body">'
      + blanks.map((b, i) => (blanks.length > 1 ? (labels[i] || ("第" + (i + 1) + "空")) + "：" : "") + esc(b)).join("\n")
      + '</div></div>';
  }
  return h;
}

function renderOpen(q) {
  let h = '<div class="actions">';
  if (!S.shown) h += '<button class="btn go" data-act="reveal">看参考答案</button>';
  h += '</div>';
  if (S.shown) {
    h += '<div class="answer"><h3>参考答案</h3><div class="body">' + esc(q.a || "（平台未提供）") + '</div></div>';
  }
  return h;
}

function renderBrowse() {
  const s = subject();
  let h = '<section class="lede"><div><h1>' + esc(s.name) + '</h1>'
    + '<p>按章查看题量与完成度　<button class="crumb" data-act="subjects">切换科目</button></p></div></section>';
  h += '<div class="bgrid">';
  s.chapters.forEach(ch => {
    const n = ch.qs.length;
    const done = ch.qs.filter(q => S.history[q.id]).length;
    const bad = ch.qs.filter(q => S.wrong.has(q.id)).length;
    const good = ch.qs.filter(q => S.history[q.id] && !S.wrong.has(q.id)).length;
    const pct = n ? Math.round(done / n * 100) : 0;
    h += '<div class="bcell"><h3>' + esc(ch.name) + '</h3>'
      + '<p>共 <b>' + n + '</b> 题　已答 <b>' + done + '</b><br>对 ' + good + '　错 ' + bad + '　完成 ' + pct + '%</p>'
      + '<div class="meter"><span style="width:' + pct + '%"></span></div></div>';
  });
  h += '</div>';
  h += '<div class="actions" style="margin-top:22px">'
    + '<button class="btn" data-act="clear-history">清空答题记录</button>'
    + '<button class="btn" data-act="reset">重置本科数据</button></div>';
  view.innerHTML = h;
}

/* ---------- actions ---------- */
function pick(k) {
  if (S.answered) return;
  const q = cur(); if (!q) return;
  S.answered = true; S.sel = k;
  const ok = k === q.a;
  S.history[q.id] = { correct: ok };
  ok ? S.wrong.delete(q.id) : S.wrong.add(q.id);
  save(); render();
}
function checkFill() {
  const q = cur(); if (!q || S.answered) return;
  const blanks = q.b || [q.a];
  S.inputs = blanks.map((_, i) => {
    const el = document.querySelector('input[data-blank="' + i + '"]');
    return el ? el.value : "";
  });
  if (S.inputs.every(v => !v.trim())) return;
  S.answered = true;
  const ok = blanks.every((b, i) => norm(S.inputs[i]) === norm(b));
  S.history[q.id] = { correct: ok };
  ok ? S.wrong.delete(q.id) : S.wrong.add(q.id);
  save(); render();
}
function reveal() { const q = cur(); if (!q) return; S.shown = true; render(); }
function step(d) {
  const p = pool(); const n = S.idx + d;
  if (n < 0 || n >= p.length) return;
  S.idx = n; S.answered = false; S.sel = null; S.inputs = null; S.shown = false; render();
}
function jump(n) {
  const p = pool(); if (!p.length) return;
  S.idx = Math.max(0, Math.min(p.length - 1, n - 1));
  S.answered = false; S.sel = null; S.inputs = null; S.shown = false; render();
}
function goMode(m) {
  if (m === "subject") { save(); S.mode = "subject"; render(); return; }
  if (!subject()) { S.mode = "subject"; return render(); }
  if (m === "chapter") { S.ch = null; S.mode = "chapter"; render(); return; }
  S.mode = m; S.idx = 0; S.answered = false; S.sel = null; S.inputs = null; S.shown = false;
  if (m === "random") S.cache = null;
  render();
}
function enterSubject(id) {
  save();
  loadSubject(id);
  S.mode = "chapter";
  render();
}
function enterChapter(id) {
  S.ch = id; S.mode = "chapter"; S.idx = 0; S.answered = false; S.sel = null; S.inputs = null; S.shown = false; render();
}
function toggleType(t) {
  S.filter.has(t) ? S.filter.delete(t) : S.filter.add(t);
  if (!S.filter.size) S.filter = new Set(subject().types);
  S.idx = 0; S.answered = false; S.sel = null; render();
}
function star() {
  const q = cur(); if (!q) return;
  S.starred.has(q.id) ? S.starred.delete(q.id) : S.starred.add(q.id);
  save();
  toast(S.starred.has(q.id) ? "已收藏" : "已取消收藏");
  render();
}

/* ---------- modal / toast ---------- */
let pending = null;
function dialog(title, text, cb, danger) {
  document.getElementById("dlgTitle").textContent = title;
  document.getElementById("dlgText").textContent = text;
  document.getElementById("dlgOk").className = danger ? "btn danger" : "btn";
  document.getElementById("overlay").dataset.open = "1";
  pending = cb;
}
function closeDialog() { document.getElementById("overlay").dataset.open = "0"; pending = null; }
document.getElementById("dlgCancel").addEventListener("click", closeDialog);
document.getElementById("dlgOk").addEventListener("click", () => { const cb = pending; closeDialog(); if (cb) cb(); });
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeDialog(); });

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.dataset.show = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.dataset.show = "0"; }, 1500);
}

/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  goMode(b.dataset.mode);
});

view.addEventListener("click", e => {
  const sub = e.target.closest(".subj");
  if (sub) { enterSubject(sub.dataset.subject); return; }
  const ch = e.target.closest(".ch-row");
  if (ch) { enterChapter(ch.dataset.ch); return; }
  const chip = e.target.closest(".chip");
  if (chip) { toggleType(chip.dataset.type); return; }
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) { pick(opt.dataset.opt); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  switch (act.dataset.act) {
    case "prev": step(-1); break;
    case "next": step(1); break;
    case "star": star(); break;
    case "check": checkFill(); break;
    case "reveal": reveal(); break;
    case "subjects": goMode("subject"); break;
    case "clear-history":
      dialog("清空答题记录", "只清除本科目的已答记录和进度，错题本与收藏保留。", () => {
        S.history = {};
        save(); toast("已清空答题记录"); render();
      });
      break;
    case "reset":
      dialog("重置本科数据", "本科目的答题记录、错题本、收藏都会删除，无法恢复。", () => {
        S.history = {}; S.wrong = new Set(); S.starred = new Set();
        try { localStorage.removeItem(storeKey()); } catch (e) {}
        toast("已重置"); render();
      }, true);
      break;
  }
});

view.addEventListener("keydown", e => {
  if (e.target.id === "jump" && e.key === "Enter") {
    jump(parseInt(e.target.value, 10) || 1); e.preventDefault();
  }
});

document.addEventListener("keydown", e => {
  const tag = (document.activeElement || {}).tagName;
  if (tag === "INPUT") {
    if (e.key === "Enter" && document.activeElement.dataset.blank !== undefined) {
      checkFill(); e.preventDefault();
    }
    return;
  }
  const p = pool(); if (!p.length) return;
  const q = cur(); if (!q) return;

  if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); return; }
  if (e.key === "ArrowRight") { step(1); e.preventDefault(); return; }
  if (e.key === " ") { if (!S.answered) { reveal(); e.preventDefault(); } return; }
  if (e.key === "s" || e.key === "S") { star(); return; }
  if (e.key === "r" || e.key === "R") { goMode("random"); return; }

  if (!S.answered && (q.t === "danxuan" || q.t === "panduan")) {
    let i = -1;
    if (e.key >= "1" && e.key <= "9") i = parseInt(e.key, 10) - 1;
    else if (/^[a-z]$/.test(e.key)) i = e.key.charCodeAt(0) - 97;
    else if (/^[A-Z]$/.test(e.key)) i = e.key.charCodeAt(0) - 65;
    if (i >= 0 && i < q.o.length) { pick(q.o[i].k); e.preventDefault(); }
    if (e.key === "Enter" && S.sel) { pick(S.sel); e.preventDefault(); }
  }
});

/* ---------- theme ---------- */
var THEME_KEY = "qt_v1_theme";
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
}
function initTheme() {
  var t = "dark";
  try { t = localStorage.getItem(THEME_KEY) || "dark"; } catch (e) {}
  applyTheme(t);
  var btn = document.getElementById("themeBtn");
  if (btn) btn.addEventListener("click", function () {
    var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    applyTheme(next);
    toast(next === "light" ? "已切到白天" : "已切到黑夜");
  });
}

/* ---------- boot ---------- */
initTheme();
(function boot() {
  let last = null;
  try { last = localStorage.getItem(LAST_KEY); } catch (e) {}
  if (last && SUBJECTS.some(s => s.id === last)) {
    loadSubject(last);
    S.mode = "chapter";
  } else {
    S.mode = "subject";
  }
  render();
})();





</script>
</body>
</html>
